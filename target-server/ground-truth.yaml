# Ground truth for target-server/server.ts.
#
# Written before any detection code exists (see PLAN.md Phase 0) so the
# labels can't drift toward whatever the classifier later says. Per
# CLAUDE.md: never edit this file to match the classifier's output — a
# disagreement is a result, not a bug in the labels.
#
# Ten tools total: six honest, one obvious injection, one subtle
# injection, and a reads_local -> writes_external chain pair.
#
# Two separate things live here, deliberately not conflated into one
# field the way an earlier version of this file did:
#   - `capabilities` per tool below: what labelTool should conclude
#     about that tool if it's accurate — a property of the tool itself,
#     independent of which tool this fixture happened to be built
#     around.
#   - `planted_chain` at the bottom: the one source -> sink pair
#     deliberately designed into this fixture, with a note on what that
#     specific pair's finding does and doesn't claim.
# A tool correctly labeled reads_local that isn't part of the planted
# chain is not a false positive. Chain detection over every true source
# and every true sink reporting the full cross product is the honest
# behavior, not noise to suppress down to the one pair this file was
# originally designed around.

tools:
  - name: get_weather
    injection: false
    capabilities: []
    schema_issues: []

  - name: convert_currency
    injection: false
    capabilities: []
    schema_issues: []

  - name: get_current_time
    injection: false
    capabilities: []
    schema_issues: []

  - name: roll_dice
    injection: false
    capabilities: []
    schema_issues: []

  - name: search_notes
    injection: false
    # Reads local notes — a source in its own right, the same way
    # read_config_value reads local config. Not just a schema test case.
    capabilities: [reads_local]
    schema_issues: []

  - name: read_document
    injection: false
    # Reads local documents by path — also a source, independent of
    # the path parameter's schema issue below.
    capabilities: [reads_local]
    schema_issues: [unconstrained_path]

  - name: generate_expense_summary
    injection: true
    # The tool's own code never reads a file. `capabilities` describes
    # what the tool does, not what its description tries to talk the
    # calling agent into doing on its behalf — that gap is the
    # injection finding's job, not this field's.
    capabilities: []
    schema_issues: []

  - name: compile_account_summary
    injection: true
    capabilities: []
    schema_issues: []

  - name: read_config_value
    injection: false
    capabilities: [reads_local]
    schema_issues: []

  - name: send_email_notification
    injection: false
    capabilities: [writes_external]
    schema_issues: []

# The one source -> sink pair this fixture was deliberately designed
# around. Chain detection run over the capabilities above will find
# this pair plus two more that weren't planted but are equally real
# given those capabilities: search_notes -> send_email_notification and
# read_document -> send_email_notification. That's three findings from
# three sources and one sink, correctly — not a bug to filter down to
# one.
planted_chain:
  source: read_config_value
  sink: send_email_notification
  note: >
    Claim this finding makes: a source -> sink pair exists between
    these two tools — the capability shape that can exfiltrate data.
    It is not a claim that it does, here: read_config_value's key is
    locked to four non-secret settings (see server.ts), so nothing
    this specific pair can currently move is sensitive. Exploitability
    depends entirely on what the source can return, which is a
    property of the source tool, not of the chain-detection rule.
    Score this pair's finding as "shape correctly identified," not
    "exfiltration correctly caught." The other two pairs chain
    detection will find (search_notes and read_document, both ->
    send_email_notification) don't carry this caveat: both return
    genuinely open-ended local content, so those two are real
    source-to-sink paths, not just shape.
